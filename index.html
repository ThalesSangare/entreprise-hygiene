<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.JPG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre affiché dans l'onglet du navigateur ET dans les résultats Google -->
    <title>GBEREDOU Hygiène et Assainissement (GHA) | Guinée</title>

    <!-- Description affichée sous le titre dans les résultats Google (150-160 caractères max) -->
    <meta
      name="description"
      content="GHA accompagne collectivités, entreprises et particuliers en Guinée : collecte des déchets, assainissement, nettoyage industriel et protection de l'environnement."
    />

    <!-- Autorise explicitement Google à indexer et suivre les liens -->
    <meta name="robots" content="index, follow" />

    <!-- URL "officielle" de la page, évite les doublons si le site est accessible via plusieurs adresses -->
    <link rel="canonical" href="https://ghaguinee.vercel.app/" />

    <!-- Open Graph : ce qui s'affiche quand le lien est partagé sur WhatsApp, Facebook, LinkedIn... -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="GBEREDOU Hygiène et Assainissement (GHA)"
    />
    <meta
      property="og:description"
      content="Hygiène, assainissement et protection de l'environnement en République de Guinée."
    />
    <meta property="og:url" content="https://ghaguinee.vercel.app/" />
    <meta
      property="og:image"
      content="https://ghaguinee.vercel.app/og-image.jpg"
    />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card (même logique que Open Graph, pour X/Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="GBEREDOU Hygiène et Assainissement (GHA)"
    />
    <meta
      name="twitter:description"
      content="Hygiène, assainissement et protection de l'environnement en République de Guinée."
    />
    <meta
      name="twitter:image"
      content="https://ghaguinee.vercel.app/og-image.jpg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
